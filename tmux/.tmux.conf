# ------------------------------------------------------------------------------
# .tmux.conf — Tmux configuration
# ------------------------------------------------------------------------------
# What it does:
#   Sets shell (zsh), 256-color terminal, prefix (Ctrl-A), pane/window keybinds,
#   copy-mode (prefix+v, then v/y), and TPM plugins (Catppuccin, yank, fzf,
#   vim-tmux-navigator, resurrect, continuum).
#
# How to interact:
#   Edit in repo (tmux/.tmux.conf). Symlink: ~/.tmux.conf → repo.
#   Reload config: prefix + r. Install/update plugins: prefix + I (capital I).
#
# Keybinding summary (prefix = Ctrl-A):
#   Panes: prefix+|/- (split v/h), prefix+h/j/k/l (move), prefix+v (copy mode), v/y (select, yank).
#   Windows: prefix+c/n/p/0-9 (new, next, prev, goto). Sessions: prefix+d (detach), prefix+s (list).
#   Config: prefix+r (reload). Plugins: prefix+I (install). Resurrect: prefix+Ctrl-s/r (save/restore).
#
# Author: Casey A. Thayer
# Location: ~/.tmux.conf (symlinked from repo)
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# Shell & terminal
# ------------------------------------------------------------------------------
# Default shell for new panes (must be installed)
set-option -g default-shell /bin/zsh

# True color: use 24-bit color so Neovim/status line look correct
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# When a window is closed, don't kill the whole session; focus-events for focus reporting
set-option -g detach-on-destroy off
set-option -g focus-events on

# Mouse: select panes, resize, scroll in copy-mode
set -g mouse on

# ------------------------------------------------------------------------------
# Prefix and key bindings
# ------------------------------------------------------------------------------
# Leader (prefix): Ctrl-A; repeat-time 0 so repeated prefix works
unbind C-b
set -g prefix C-a
set -g repeat-time 0

# Vim-style pane navigation: prefix + h/j/k/l to move between panes
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Splits: prefix + | (vertical), prefix + - (horizontal)
bind | split-window -h
bind - split-window -v

# Reload this config: prefix + r
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# ------------------------------------------------------------------------------
# Copy-mode (scrollback and copy to clipboard)
# ------------------------------------------------------------------------------
# Enter copy-mode with prefix + v; then v to start selection, y to copy
# tmux-yank plugin (below) sends selection to system clipboard when possible
bind 'v' copy-mode
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

# Keep copy-mode active after mouse-drag selection (don't exit on MouseDragEnd)
unbind -T copy-mode-vi MouseDragEnd1Pane

# ------------------------------------------------------------------------------
# TPM (Tmux Plugin Manager) — plugins listed here; install with prefix + I
# ------------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'

# tmux-yank: copy selection to system clipboard (OSC52 or external tool)
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_selection 'clipboard'
set -g @clipboard 'external'

# Catppuccin theme for status line and window list
set -g @plugin 'catppuccin/tmux#v2.1.3'

# tmux-fzf: fuzzy find sessions/windows (triggered by plugin keybindings)
set -g @plugin 'sainnhe/tmux-fzf'

# vim-tmux-navigator: seamless C-h/j/k/l between Neovim splits and tmux panes
set -g @plugin 'christoomey/vim-tmux-navigator'

# tmux-resurrect: save/restore pane layout and commands (prefix + Ctrl-s / Ctrl-r)
set -g @plugin 'tmux-plugins/tmux-resurrect'

# tmux-continuum: auto-save every 15 min; restore on tmux server start
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ------------------------------------------------------------------------------
# Catppuccin theme options
# ------------------------------------------------------------------------------
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_current_text " #{b:pane_current_path}"
set -g @catppuccin_window_text " #{b:pane_current_path}"
set -g @catppuccin_window_status_style "rounded"
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set-window-option -g status-position bottom

# ------------------------------------------------------------------------------
# Load TPM (must be at end of file)
# ------------------------------------------------------------------------------
run '~/.tmux/plugins/tpm/tpm'
