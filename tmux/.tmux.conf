# ------------------------------------------------------------------------------
# ⚙️ Tmux Core Settings
# ------------------------------------------------------------------------------

# Use Zsh as the default shell
set-option -g default-shell /bin/zsh

# Enable true color support
set -g default-terminal "tmux-256color"

# Prevent session exit from killing others
set-option -g detach-on-destroy off
set-option -g focus-events on

# Enable mouse interactions (click, scroll, drag)
set -g mouse on

# ------------------------------------------------------------------------------
# ⌨️ Key Bindings
# ------------------------------------------------------------------------------

# Set leader key to Ctrl-A
unbind C-b
set -g prefix C-a
set -g repeat-time 0

# Vim-style pane navigation
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Split windows
bind | split-window -h
bind - split-window -v

# Reload config with leader + r
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# ------------------------------------------------------------------------------
# 📋 Copy Mode Enhancements
# ------------------------------------------------------------------------------

# Vi-style selection in copy mode
bind 'v' copy-mode
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

# Stay in copy mode after dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane


# ------------------------------------------------------------------------------
# 🔌 TPM Plugins
# ------------------------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'                  # Plugin manager

# Use OSC52 clipboard copy in Tmux (via tmux-yank)
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_selection 'clipboard'
set -g @clipboard 'external'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'sainnhe/tmux-fzf'                  # FZF integration
set -g @plugin 'christoomey/vim-tmux-navigator'    # Seamless Vim ↔ Tmux pane nav

# ------------------------------------------------------------------------------
# 🎨 UI: Catppuccin Theme & Status Line
# ------------------------------------------------------------------------------

# Theme Config
set -g @catppuccin_flavor "mocha"

set -g @catppuccin_window_current_text " #{b:pane_current_path}"
set -g @catppuccin_window_text " #{b:pane_current_path}"

# Status bar customization
set -g @catppuccin_window_status_style "rounded"
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set-window-option -g status-position bottom

# ------------------------------------------------------------------------------
# 🚀 TPM Initialization (keep at end)
# ------------------------------------------------------------------------------
run '~/.tmux/plugins/tpm/tpm'
